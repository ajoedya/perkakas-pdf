<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Lencana bundar bersiluet orang utan bergelantung pada dahan dengan satu lengan panjang. Gambar sendiri. -->
<defs><clipPath id="b"><circle cx="32" cy="32" r="32"/></clipPath></defs>
<circle cx="32" cy="32" r="32" fill="#08274d"/>
<g clip-path="url(#b)" fill="#fff6e3" stroke="#fff6e3" stroke-linecap="round" stroke-linejoin="round">
<!-- dahan -->
<path d="M-2 12.500C16 8.500 40 7 66 9.500" fill="none" stroke-width="3.400"/>
<!-- lengan panjang yang menggenggam dahan -->
<path d="M25.500 8.600C22.300 15 21.300 23 23.600 31.500" fill="none" stroke-width="5"/>
<!-- kepala berbantalan pipi -->
<ellipse cx="38.200" cy="23.500" rx="8.200" ry="7.400" stroke="none"/>
<!-- badan -->
<path d="M21.200 30.500c2.300-4 7.300-5.700 11.800-4.300 3.300-1 7.300 0 9.800 2.600 4.300 4.400 5.300 11.500 2.600 17.300-2.400 5.200-7.800 8.300-13.400 7.700C25.300 53.100 20 47.300 19.500 40.300c-.200-3.600.400-7 1.700-9.800Z" stroke-width="1"/>
<!-- lengan yang menjuntai sampai di bawah kaki -->
<path d="M44.200 32.500c5.800 4.300 8.300 11.700 6.300 20.500" fill="none" stroke-width="4.600"/>
<!-- kaki pendek yang tertekuk -->
<path d="M25.300 51.300c-2.600 1.300-4.700 3.600-5.800 6.700M36.800 53.300c1.800 1.600 3 3.800 3.400 6.400" fill="none" stroke-width="4.600"/>
<!-- bulu panjang di bawah ketiak dan lengan -->
<path d="M21 32.500l-4.500 4 3.700-.200-4 4.600 4-.500-3.200 5.200 4.500-1.500ZM47.600 38l5 2.200-2.700 1 4.300 3.300-3.300.300 3 4.500-4.600-1.500Z" stroke-width=".600"/>
</g>
</svg>
